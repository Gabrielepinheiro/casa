<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Família">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Família Pinheiro Bernt Eymael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Quadro da família: colunas lado a lado (Casa + cada pessoa), visual claro como o Nipto. Tema único, claro. */
  :root {
    --bg: #f7f8fb; --card: #ffffff; --ink: #3d4260; --muted: #8d93a8; --line: #eceef4;
    --accent: #fcc934; --accent-ink: #9a7400; --accent-soft: #fff8e1;
    --ok: #3fa57f; --ok-soft: #eaf7f1; --danger: #d9506f; --danger-soft: #fdeef2;
    --shadow: 0 2px 12px rgba(61, 66, 96, .05);
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  input, select, textarea { user-select: text; -webkit-user-select: text; font: inherit; color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .muted { color: var(--muted); }
  .pad { padding: 8px 4px; margin: 0; font-size: .88rem; }
  .spacer { flex: 1; }
  .ui { width: 20px; height: 20px; flex: none; }
  .star { width: 14px; height: 14px; color: var(--accent); flex: none; }
  .ico { width: 40px; height: 40px; flex: none; }
  .ico.sm { width: 30px; height: 30px; }
  .ico.xs { width: 22px; height: 22px; }
  .ico.lg { width: 76px; height: 76px; }

  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .tucano { width: 40px; height: auto; flex: none; }
  .brand h1 { font-size: 1.1rem; font-weight: 700; }
  .brand small { color: var(--muted); font-size: .82rem; }
  nav.tabs { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  nav.tabs button { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 12px; font-weight: 600; min-height: 44px; }
  nav.tabs button.on { background: var(--accent-soft); color: var(--ink); }
  nav.tabs button.on .ui { color: var(--accent-ink); }

  main { padding: 16px; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; min-height: 44px; background: var(--card); }
  .btn.primary { background: var(--accent); color: var(--ink); }
  .btn.soft { background: var(--card); border: 1px solid var(--line); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.icon-btn { width: 44px; justify-content: center; padding: 0; border: 1px solid var(--line); }
  .btn:disabled { opacity: .4; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row-btns.top { margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 600; min-height: 40px; color: var(--muted); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; border-radius: 999px; padding: 3px 10px; font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; object-fit: cover;
    background: color-mix(in srgb, var(--c, #c7c9d6) 35%, white); color: var(--ink); font-weight: 700; border: 2px solid var(--c, var(--line)); }
  .avatar.mini { width: 24px; height: 24px; font-size: .7rem; border-width: 1.5px; }
  .avatar.xl { width: 88px; height: 88px; font-size: 2rem; border-width: 3px; }
  .avatar.house { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .avatar.house .ui { width: 22px; height: 22px; }

  .daynav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .daynav-label { min-width: 150px; text-align: center; }
  .daynav-label b { display: block; font-size: 1.2rem; }
  .daynav-label small { color: var(--muted); }

  .notice { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
  .notice .tucano { width: 64px; height: auto; flex: none; }
  .notice-body { min-width: 0; flex: 1; }
  .notice h3 { font-size: .95rem; margin: 2px 0 6px; }
  .notice h3.muted { margin-top: 10px; }
  .notice ul, .agenda-day ul, .card > ul { list-style: none; margin: 0; padding: 0; }
  .agenda-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 0; font-weight: 500; }
  .agenda-item small { display: block; color: var(--muted); font-size: .82rem; }
  .agenda-item.change { color: var(--muted); }
  .time { display: inline-block; font-size: .75rem; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 0 6px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .hint { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border-radius: 16px; padding: 12px 16px; }
  .hint > .ui { color: var(--accent-ink); margin-top: 2px; }

  /* Quadro: uma coluna por pessoa, lado a lado */
  .board-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; }
  .board { display: grid; grid-template-columns: repeat(var(--cols), minmax(230px, 1fr)); gap: 12px; align-items: start; min-width: min-content; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
  .house-col { background: #fffdf6; }
  .col-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .col-head > div { min-width: 0; flex: 1; }
  .col-head h2 { font-size: 1.05rem; font-weight: 700; }
  .col-head small { color: var(--muted); font-size: .78rem; display: block; }
  .progress { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; background: var(--c); border-radius: 9px; transition: width .4s; }
  .period { font-size: .72rem; font-weight: 600; color: var(--muted); margin: 12px 2px 6px; text-transform: uppercase; letter-spacing: .06em; }

  .task { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin-bottom: 6px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); text-align: left; min-height: 56px; transition: transform .1s, background .2s; }
  .task:active { transform: scale(.98); }
  .task.big { min-height: 66px; }
  .task.big .ico { width: 50px; height: 50px; }
  .task .text { flex: 1; min-width: 0; overflow-wrap: break-word; }
  .task .title { display: block; font-size: .9rem; font-weight: 600; line-height: 1.25; }
  .task .note { display: block; font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .task .daynote { display: block; margin-top: 4px; font-size: .75rem; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; }
  .check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #d5d9e4; display: grid; place-items: center; flex: none; color: #fff; }
  .check .ui { width: 16px; height: 16px; }
  .task.done { background: var(--ok-soft); border-color: transparent; }
  .task.done .title { color: var(--muted); text-decoration: line-through; }
  .task.done .check { background: var(--ok); border-color: var(--ok); }
  .task.skipped { opacity: .5; border-style: dashed; }
  .task.editing { border-style: dashed; border-color: var(--accent); }
  .edit-dot { color: var(--accent-ink); flex: none; }
  .did { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .did span:nth-child(2) { flex: 1; min-width: 0; }
  .did .pts { color: var(--ok); font-weight: 700; }
  .skipped-list { font-size: .78rem; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 8px 10px; margin-top: 6px; }
  .skipped-list div { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .skipped-list .ui { width: 14px; height: 14px; }
  .alldone { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px; color: var(--ok); }
  .alldone .tucano { width: 52px; height: auto; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }

  /* Casa: panorama da semana */
  .btn.small { min-height: 34px; padding: 4px 10px; font-size: .78rem; border-radius: 10px; }
  .day-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day-chip { display: flex; flex-direction: column; align-items: center; gap: 1px; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 2px; min-height: 64px; }
  .day-chip b { font-size: .95rem; }
  .day-chip small { color: var(--muted); font-size: .7rem; }
  .day-chip span { font-size: .72rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day-chip span.full { color: var(--ok); }
  .day-chip.is-today b { color: var(--accent-ink); }
  .day-chip.on { background: var(--accent-soft); border-color: var(--accent); }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; align-items: start; }
  .group-card .section-head { margin-bottom: 10px; }

  /* Prioridades e atrasos */
  .task .late { display: block; margin-top: 4px; font-size: .75rem; font-weight: 600; color: var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 2px 8px; }
  .priorities h2 { display: flex; align-items: center; gap: 8px; }
  .priorities h2 .ui { color: var(--danger); }
  .prio, .shop { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .prio:last-child, .shop:last-child { border: 0; }
  .prio-check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #d5d9e4; background: var(--card); display: grid; place-items: center; flex: none; color: #fff; padding: 0; }
  .prio-check .ui { width: 16px; height: 16px; }
  .prio.done .prio-check, .shop.done .prio-check { background: var(--ok); border-color: var(--ok); }
  .prio-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; font-weight: 600; padding: 6px 0; min-height: 40px; }
  .prio.done .prio-text, .shop.done .shop-text b { color: var(--muted); text-decoration: line-through; }
  .page-title { font-size: 1.05rem; margin: 6px 0 -4px; }

  /* Cardápio */
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 12px; align-items: start; }
  .menu-day { padding: 12px; }
  .menu-day.is-today { border-color: var(--accent); }
  .menu-day h2 { font-size: 1rem; text-transform: capitalize; margin: 0; }
  .menu-day h2 small { color: var(--muted); font-weight: 400; font-size: .78rem; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent-ink); }
  .meal { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px dashed #d5d9e4; background: var(--bg); border-radius: 14px; padding: 8px; margin-top: 8px; text-align: left; min-height: 60px; }
  .meal.filled { border-style: solid; border-color: var(--line); background: var(--card); }
  .meal img, .meal .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; }
  .meal span:last-child { min-width: 0; font-weight: 600; font-size: .9rem; }
  .meal small { display: block; color: var(--muted); font-weight: 500; font-size: .72rem; }
  .ph { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; }
  .ph.big { width: 100%; aspect-ratio: 4 / 3; height: auto; border-radius: 14px; }
  .ph.big .ui { width: 40px; height: 40px; }
  .ui.fav { width: 14px; height: 14px; color: var(--danger); vertical-align: -2px; margin-right: 4px; }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 12px; }
  .recipe { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 10px; }
  .recipe img { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; }
  .recipe small { color: var(--muted); font-size: .75rem; }
  .recipe-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .recipe-pick label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 6px; font-size: .85rem; font-weight: 600; }
  .recipe-pick label:has(input:checked) { border: 2px solid var(--accent); background: var(--accent-soft); }
  .recipe-pick input { position: absolute; opacity: 0; }
  .recipe-pick img, .recipe-pick .ph { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
  .recipe-photo { width: 100%; max-width: 100%; max-height: 280px; object-fit: cover; border-radius: 16px; }
  .recipe-thumb { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
  .sub-title { font-size: .95rem; margin: 14px 0 6px; }
  .ing-list { margin: 0; padding-left: 20px; }
  .steps { white-space: pre-wrap; margin: 0; }
  .shop-text { flex: 1; min-width: 0; }
  .shop-text b { display: block; font-weight: 600; }
  .shop-text small { color: var(--muted); font-size: .75rem; }
  .opts.column { flex-direction: column; align-items: stretch; }
  .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font: inherit; font-size: 1rem; resize: vertical; }

  /* Semana */
  .table-wrap { overflow-x: auto; }
  table.week { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
  table.week th { text-align: left; font-weight: 600; padding: 4px 6px; white-space: nowrap; }
  table.week tbody th { display: flex; align-items: center; gap: 8px; max-width: 280px; }
  table.week tbody th span { overflow: hidden; text-overflow: ellipsis; }
  table.week thead th { text-align: center; font-size: .8rem; color: var(--muted); }
  table.week thead th small { display: block; font-weight: 400; }
  table.week thead th.is-today { color: var(--accent-ink); }
  table.week td { text-align: center; border-radius: 10px; padding: 6px 4px; font-weight: 600; min-width: 46px; height: 38px; }
  table.week td .ui { width: 16px; height: 16px; vertical-align: middle; }
  table.week.detail td { cursor: pointer; }
  td.ok { background: var(--ok-soft); color: var(--ok); }
  td.half { background: var(--accent-soft); color: var(--accent-ink); }
  td.miss { background: var(--danger-soft); color: var(--danger); }
  td.todo { background: var(--accent-soft); }
  td.later { background: var(--bg); color: var(--muted); }
  td.skip { background: var(--bg); color: var(--muted); }
  td.none { color: var(--line); }
  td.pts-cell { color: var(--accent-ink); white-space: nowrap; }
  .legend { color: var(--muted); font-size: .8rem; margin: 8px 0 0; }
  .notes { list-style: none; margin: 0; padding: 0; }
  .notes li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

  /* Agenda */
  .agenda-day { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .agenda-day:last-child { border: 0; }
  .agenda-day h3 { font-size: 1rem; margin-bottom: 4px; }
  .agenda-day h3 small { color: var(--muted); font-weight: 400; font-size: .82rem; }

  /* Placar e prêmios */
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 14px; align-items: start; }
  .rank { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rank:last-child { border: 0; }
  .rank .pos { width: 22px; font-weight: 700; color: var(--muted); text-align: center; }
  .rank .name { font-weight: 600; flex: 1; }
  .rank-pts { text-align: right; }
  .rank-pts b { font-size: 1.2rem; }
  .rank-pts small { display: block; color: var(--muted); font-size: .75rem; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .log li span:nth-of-type(1) { flex: 1; min-width: 0; }
  .log time { color: var(--muted); font-size: .78rem; min-width: 84px; }
  .log .p { font-weight: 700; color: var(--ok); }
  .log .p.neg { color: var(--danger); }
  .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 12px; }
  .reward { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .reward .title { font-weight: 600; }

  /* Ajustes */
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .section-head h2 { margin: 0; }
  .section-head small { color: var(--muted); font-weight: 400; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border: 0; }
  .row .info { flex: 1; min-width: 0; }
  .row .info b { font-weight: 600; font-size: .9rem; }
  .row .info small { display: block; color: var(--muted); font-size: .78rem; }
  .card .chips { margin: 8px 0; }

  .empty-page { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty-page.small { padding: 16px; }
  .empty-page h2 { color: var(--ink); margin-bottom: 6px; }
  .tucano.big { width: 110px; height: auto; }

  /* Diálogos */
  dialog { border: 0; border-radius: 20px; padding: 0; width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 32px); color: var(--ink); background: var(--card); }
  dialog::backdrop { background: rgba(61, 66, 96, .35); }
  dialog form { padding: 20px; }
  dialog h2 { font-size: 1.15rem; margin-bottom: 14px; }
  .dlg-sub { display: block; font-size: .85rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .field { display: block; margin-bottom: 14px; min-width: 0; }
  .field > span { display: block; font-weight: 600; font-size: .82rem; margin-bottom: 6px; color: var(--muted); }
  .field input[type=text], .field input[type=number], .field input[type=password], .field input[type=date], .field input[type=time], .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 1rem; min-height: 44px; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; min-height: 40px; }
  .opts label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opts input { accent-color: var(--accent-ink); }
  .swatch { width: 36px; height: 36px; padding: 0 !important; justify-content: center; }
  .swatch input { opacity: 0; position: absolute; }
  .swatch:has(input:checked) { outline: 3px solid var(--ink); outline-offset: 2px; }
  .icon-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; max-height: 220px; overflow-y: auto; padding: 2px; }
